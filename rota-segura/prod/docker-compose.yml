volumes:
  postgresql_data:
    driver: local

services:

  database:
    container_name: rotasegura-database
    restart: always
    image: postgres:12.3
    environment:
      POSTGRES_DB: rotasegura
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - postgresql_data:/var/lib/postgresql/data

  backend:
    container_name: rotasegura-backend
    restart: always
    image: us-central1-docker.pkg.dev/galvanic-tea-477602-t7/rotasegura/rotasegura-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      GOOGLE_API_KEY: senha
      GOOGLE_MAP_KEY: senha
      GEMINI_API_KEY: senha
    ports:
      - 8081:8081
    depends_on:
      - database

  frontend:
    container_name: rotasegura-frontend
    restart: always
    image: us-central1-docker.pkg.dev/galvanic-tea-477602-t7/rotasegura/rotasegura-frontend
    ports:
      - "80:8080"
    depends_on:
      - backend
