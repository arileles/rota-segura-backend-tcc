spring.application.name=rotasegura-backend

server.port=8081
master.user.email=admin@rotasegura.com.br
master.user.name=Administrator
master.user.password=pronto

security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in millisecond
security.jwt.expiration-time=3600000

spring.profiles.active=dev

#---
spring.config.activate.on-profile=dev
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/rotasegura
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.flyway.locations=classpath:db/migration,classpath:db/load
spring.flyway.outOfOrder=true
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

google.api.key=${GOOGLE_API_KEY}
google.map.key=${GOOGLE_MAP_KEY}
gemini.api.key=${GEMINI_API_KEY}